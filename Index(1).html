<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四年级数学｜百分比练习</title>
  <style>
    :root{--blue:#1d4ed8;--light:#eff6ff;--ink:#172033;--line:#d7e2f2;--green:#157347;--red:#b42318;--orange:#8a4b10}
    *{box-sizing:border-box}body{margin:0;background:#f4f8ff;color:var(--ink);font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;font-size:16px}
    header{background:linear-gradient(120deg,#fff,#e7f1ff);border-bottom:1px solid #cfe0f7}.wrap{width:min(880px,calc(100% - 28px));margin:auto}.head{padding:30px 0}
    .eyebrow{margin:0 0 8px;color:var(--blue);font-weight:800;letter-spacing:.16em;font-size:14px}h1{margin:0;font-size:clamp(30px,6vw,42px)}.intro{margin:10px 0 0;color:#59657a;font-weight:600}
    .student,.result,.q,.submit{background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 7px 22px rgba(37,64,110,.06)}
    .student{margin:25px 0;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;margin-bottom:7px;font-weight:800}.field input{width:100%;height:47px;border:2px solid #c8d5e7;border-radius:10px;padding:0 12px;font-size:16px}.progress{grid-column:1/-1}.progress-row{display:flex;justify-content:space-between;margin-bottom:7px;color:#5a6578;font-size:14px;font-weight:800}.bar{height:10px;background:#dce6f4;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--blue);transition:.2s}
    #questions{display:grid;gap:18px}.q{padding:20px}.qtop{display:flex;gap:12px}.num{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border-radius:11px;background:var(--blue);color:#fff;font-weight:900}.qbody{flex:1;min-width:0}.q h2{font-size:18px;line-height:1.55;margin:2px 0 15px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{display:flex;align-items:center;gap:10px;min-height:51px;border:2px solid #dce5f1;border-radius:12px;padding:9px 12px;font-weight:700;cursor:pointer}.option:hover{border-color:#80a9e6;background:#f6f9ff}.option input{width:18px;height:18px;accent-color:var(--blue)}.option.chosen{border-color:#3b82f6;background:#eff6ff}.option.good{border-color:#36a269;background:#ecfdf3;color:#11623b}.option.bad{border-color:#dc5b52;background:#fff1f0;color:#9d241d}
    .grid100{display:grid;width:min(230px,100%);grid-template-columns:repeat(10,1fr);gap:2px;margin:0 0 15px;border:3px solid #b5c6dc;background:#b5c6dc;padding:2px;border-radius:7px}.grid100 i{aspect-ratio:1;background:#fff}.grid100 i.on{background:#3b82f6}
    .explain{margin-top:15px;border-radius:13px;padding:14px;font-weight:650;line-height:1.65}.explain.ok{background:#ecfdf3;color:#12623c}.explain.no{background:#fff5e6;color:var(--orange)}.explain b{display:block;margin-bottom:7px}.step{margin-top:7px}.step em{font-style:normal;background:#fff;border-radius:999px;padding:3px 8px;margin-right:6px;font-size:13px;font-weight:900}
    .submit{margin:22px 0 70px;padding:22px;text-align:center;background:#eef5ff;border-style:dashed}.submit button,.again{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:14px 25px;font-size:17px;font-weight:900;cursor:pointer}.submit button:disabled{opacity:.6}.notice{min-height:24px;margin:0 0 10px;color:var(--red);font-weight:800}.small{color:#667085;font-size:14px}.result{display:none;margin:25px 0;padding:22px;border-color:#93c5fd;background:linear-gradient(120deg,#fff,#eff6ff)}.result.show{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.score{font-size:38px;font-weight:900}.sent{font-weight:900;color:var(--green)}.failed{font-weight:900;color:var(--red)}
    @media(max-width:600px){.student,.options{grid-template-columns:1fr}.q{padding:15px}.wrap{width:min(100% - 20px,880px)}}
    @media print{.student,.submit,.again{display:none!important}.q{box-shadow:none;break-inside:avoid}body{background:#fff}}
  </style>
</head>
<body>
  <header><div class="wrap head"><p class="eyebrow">四年级数学</p><h1>百分比练习</h1><p class="intro">共 15 题 · 提交后查看分数、错题解释和计算步骤</p></div></header>
  <main class="wrap">
    <section id="result" class="result"><div><div id="resultName"></div><div id="score" class="score"></div><div id="percent"></div></div><div><div id="sendStatus"></div><button class="again" onclick="location.reload()">重新练习</button></div></section>
    <section id="student" class="student"><div class="field"><label for="name">学生姓名 *</label><input id="name" placeholder="请输入姓名"></div><div class="field"><label for="className">班级（选填）</label><input id="className" placeholder="例如：4A"></div><div class="progress"><div class="progress-row"><span>作答进度</span><span id="progressText">0 / 15</span></div><div class="bar"><span id="progressBar"></span></div></div></section>
    <section id="questions"></section>
    <section id="submitBox" class="submit"><p id="notice" class="notice"></p><button id="submitBtn" onclick="submitQuiz()">提交答案与成绩</button><p class="small">提交后不能修改答案，请先检查。</p></section>
  </main>
  <script>
    const Q=[
      ["35/100 写成百分比是多少？",["3.5%","35%","350%","65%"],"35%",["分母是 100，可以直接看分子。","35/100 = 35%。"]],
      ["下图有多少百分比的格子涂上颜色？",["18%","28%","72%","82%"],"28%",["全部共有 100 格。","涂色的有 28 格，所以是 28/100 = 28%。"],28],
      ["72% 写成分母是 100 的分数，正确的是哪一个？",["7/2","72/10","72/100","100/72"],"72/100",["百分比表示“每一百份中有多少份”。","72% 就是每 100 份中有 72 份，所以是 72/100。"]],
      ["1/2 等于多少百分比？",["2%","20%","50%","100%"],"50%",["把分母 2 变成 100：2 × 50 = 100。","分子也乘 50：1 × 50 = 50，所以 1/2 = 50/100 = 50%。"]],
      ["3/4 等于多少百分比？",["25%","34%","70%","75%"],"75%",["把分母 4 变成 100：4 × 25 = 100。","分子也乘 25：3 × 25 = 75，所以 3/4 = 75%。"]],
      ["哪个百分比最小？",["45%","54%","65%","75%"],"45%",["百分号相同，只要比较数字部分。","45 < 54 < 65 < 75，所以 45% 最小。"]],
      ["20 颗弹珠中有 10 颗是蓝色的。蓝色弹珠占多少百分比？",["10%","20%","50%","100%"],"50%",["蓝色弹珠占 10/20。","10/20 = 1/2，而 1/2 = 50%。"]],
      ["50 朵花中有 15 朵是红花。红花占多少百分比？",["15%","25%","30%","35%"],"30%",["红花占 15/50。","分子和分母都乘 2：15/50 = 30/100。","所以红花占 30%。"]],
      ["36 的 50% 是多少？",["16","18","20","23"],"18",["50% = 1/2，也就是一半。","36 ÷ 2 = 18。"]],
      ["70 的 10% 是多少？",["7","10","17","60"],"7",["10% = 1/10。","70 ÷ 10 = 7。"]],
      ["20 的 25% 是多少？",["4","5","10","15"],"5",["25% = 1/4。","20 ÷ 4 = 5。"]],
      ["50 的 60% 是多少？",["20","25","30","35"],"30",["先求 50 的 10%：50 ÷ 10 = 5。","60% 是 6 个 10%：5 × 6 = 30。"]],
      ["一个班有 40 名学生，25% 的学生请假。请假的学生有多少名？",["5 名","10 名","15 名","25 名"],"10 名",["25% = 1/4。","40 ÷ 4 = 10，所以请假的学生有 10 名。"]],
      ["一件 RM100 的书包优惠 20%。优惠了多少钱？",["RM10","RM20","RM80","RM120"],"RM20",["先求 RM100 的 10%：RM100 ÷ 10 = RM10。","20% 是 2 个 10%：RM10 × 2 = RM20。","题目问优惠的钱，不是优惠后的售价。"]],
      ["25 本故事书的 80% 被借走了。被借走多少本？",["5 本","15 本","20 本","80 本"],"20 本",["80% = 80/100 = 4/5。","25 ÷ 5 = 5，再算 5 × 4 = 20。","所以被借走 20 本。"]]
    ];
    const answers={};
    const list=document.getElementById('questions');
    Q.forEach((q,i)=>{const art=document.createElement('article');art.className='q';const grid=q[4]?'<div class="grid100" aria-label="'+q[4]+'格已涂色">'+Array.from({length:100},(_,n)=>'<i class="'+(n<q[4]?'on':'')+'"></i>').join('')+'</div>':'';art.innerHTML='<div class="qtop"><span class="num">'+(i+1)+'</span><div class="qbody"><h2>'+q[0]+'</h2>'+grid+'<div class="options">'+q[1].map(o=>'<label class="option"><input type="radio" name="q'+i+'" value="'+o+'"><span>'+o+'</span></label>').join('')+'</div><div class="feedback"></div></div></div>';list.appendChild(art);art.querySelectorAll('input').forEach(r=>r.addEventListener('change',()=>{answers[i]=r.value;art.querySelectorAll('.option').forEach(x=>x.classList.remove('chosen'));r.closest('.option').classList.add('chosen');updateProgress()}));});
    function updateProgress(){const n=Object.keys(answers).length;document.getElementById('progressText').textContent=n+' / '+Q.length;document.getElementById('progressBar').style.width=(n/Q.length*100)+'%'}
    function submitQuiz(){const name=document.getElementById('name').value.trim();const cls=document.getElementById('className').value.trim();const notice=document.getElementById('notice');if(!name){notice.textContent='请先填写姓名。';document.getElementById('name').focus();return}if(Object.keys(answers).length<Q.length){notice.textContent='还有 '+(Q.length-Object.keys(answers).length)+' 题未作答，请完成后再提交。';return}notice.textContent='';let score=0;document.querySelectorAll('.q').forEach((art,i)=>{const q=Q[i],correct=answers[i]===q[2];if(correct)score++;art.querySelectorAll('input').forEach(x=>x.disabled=true);art.querySelectorAll('.option').forEach(x=>{const v=x.querySelector('input').value;if(v===q[2])x.classList.add('good');else if(v===answers[i])x.classList.add('bad')});const fb=art.querySelector('.feedback');fb.className='feedback explain '+(correct?'ok':'no');fb.innerHTML=correct?'<b>✓ 答对了！</b>':'<b>正确答案：'+q[2]+'</b>'+q[3].map((s,n)=>'<div class="step"><em>步骤 '+(n+1)+'</em>'+s+'</div>').join('')});document.getElementById('student').style.display='none';document.getElementById('submitBox').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('resultName').textContent=name+' 的成绩';document.getElementById('score').textContent=score+' / '+Q.length;document.getElementById('percent').textContent=Math.round(score/Q.length*100)+' 分';document.getElementById('sendStatus').textContent='正在把成绩交给老师……';window.scrollTo({top:0,behavior:'smooth'});if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(()=>{document.getElementById('sendStatus').className='sent';document.getElementById('sendStatus').textContent='✓ 成绩已交给老师'}).withFailureHandler(()=>{document.getElementById('sendStatus').className='failed';document.getElementById('sendStatus').textContent='成绩传送失败，请告诉老师'}).saveResult(name,cls,score,Q.length)}else{document.getElementById('sendStatus').className='failed';document.getElementById('sendStatus').textContent='请通过老师提供的网页链接提交成绩'}}
  </script>
</body>
</html>
